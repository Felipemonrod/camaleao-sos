name: Android e Painel
on:
  push:
    branches: [main, 'feat/**']
  pull_request:
jobs:
  validar:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: android-actions/setup-android@v3
      - run: python tools/preparar-modelos.py
      - run: chmod +x gradlew && ./gradlew :app:assembleDebug :app:testDebugUnitTest :app:lintDebug
      - run: node server/setup.mjs > /tmp/camaleao-pareamento-teste.txt && node --test server/test/*.test.mjs
      - run: python tools/verificar-sot.py
      - uses: actions/upload-artifact@v4
        with:
          name: Camaleao-SOS-debug
          path: app/build/outputs/apk/debug/app-debug.apk
